<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" style="--primary:oklch(0.511 0.148 39.7);--foreground:oklch(0.257 0.022 63.6);"><style>.chm{--chm-c:var(--logo-c,var(--primary));--chm-h:var(--logo-h,var(--foreground));--chm-wire:var(--logo-wire,var(--chm-c));overflow:visible}
.chm-wire{fill:none;stroke:var(--chm-wire);stroke-width:1.3;stroke-linejoin:round;opacity:.5}
.chm-inner{opacity:.75}
.chm-letters path{stroke-width:.7;stroke-linejoin:round}
/* C: its main faces point left (+y) */
.chm-c.chm-py{fill:var(--chm-c);stroke:color-mix(in oklch,var(--chm-c),white 35%)}
.chm-c.chm-top{fill:color-mix(in oklch,var(--chm-c),white 32%);stroke:color-mix(in oklch,var(--chm-c),white 55%)}
.chm-c.chm-px{fill:color-mix(in oklch,var(--chm-c),black 45%);stroke:color-mix(in oklch,var(--chm-c),black 30%)}
/* H: its main faces point right (+x) */
.chm-h.chm-px{fill:color-mix(in oklch,var(--chm-h),black 6%);stroke:color-mix(in oklch,var(--chm-h),white 35%)}
.chm-h.chm-top{fill:color-mix(in oklch,var(--chm-h),white 30%);stroke:color-mix(in oklch,var(--chm-h),white 55%)}
.chm-h.chm-py{fill:color-mix(in oklch,var(--chm-h),black 42%);stroke:color-mix(in oklch,var(--chm-h),black 28%)}
.chm-nodes{fill:var(--chm-c)}
.dark .chm--glow .chm-letters{filter:drop-shadow(0 0 5px color-mix(in oklch,var(--chm-c),transparent 50%))}
.dark .chm--glow .chm-wire,.dark .chm--glow .chm-nodes{filter:drop-shadow(0 0 3px var(--chm-c))}
